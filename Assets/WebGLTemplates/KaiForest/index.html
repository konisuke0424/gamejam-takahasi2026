<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>まねごえの森</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #000; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 gap: 18px; color: #b8b2a8; font-family: "Yu Mincho", "Hiragino Mincho ProN", serif; letter-spacing: .4em; }
      #loading .title { font-size: 28px; }
      #loading .note { font-size: 12px; color: #776f66; letter-spacing: .2em; }
      #bar { width: 260px; height: 2px; background: #1c1c1c; }
      #fill { width: 0; height: 100%; background: #8a2a22; transition: width .2s; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div class="title">まねごえの森</div>
      <div id="bar"><div id="fill"></div></div>
      <div class="note">ヘッドホン推奨</div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      // Mouse-only controls: right button walks backward, middle button looks around.
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      canvas.addEventListener("mousedown", function (e) { if (e.button === 1) e.preventDefault(); canvas.focus(); });
      window.addEventListener("auxclick", function (e) { if (e.button === 1) e.preventDefault(); });

      var script = document.createElement("script");
      script.src = "Build/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, {
          arguments: [],
#if PROGRESSIVE_ASSET_LOADING
          primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
          secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
          dataUrl: "Build/{{{ DATA_FILENAME }}}",
#endif
          frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
          workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
          codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
          symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
          streamingAssetsUrl: "StreamingAssets",
          companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
          productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
          productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
          devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
        }, function (progress) {
          document.querySelector("#fill").style.width = (100 * progress) + "%";
        }).then(function (instance) {
          window.unityInstance = instance;
          var l = document.querySelector("#loading");
          if (l) l.remove();
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
